[project]
name = "here-ev-mcp"
version = "0.1.0"
description = "MCP server wrapping HERE EV Routing and Geocoding APIs for electric vehicles"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
here-ev-mcp = "server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["."]
